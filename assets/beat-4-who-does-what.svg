<line x1="325" y1="295" x2="400" y2="230" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/>
<line x1="500" y1="230" x2="575" y2="295" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/>
<line x1="675" y1="295" x2="750" y2="230" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/>
<line x1="850" y1="230" x2="925" y2="295" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/>
<line x1="1025" y1="295" x2="1100" y2="230" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/>
<text x="625" y="436.1" font-size="17" text-anchor="middle" fill="#495057" font-family="Segoe UI, Helvetica, Arial, sans-serif">Humans decide. Agents do the work. Nothing changes before the assessment is approved, and nothing reaches main without a human merge.</text>
