<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect x="0" y="0" width="1500" height="600" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="750" y="40" font-size="26" text-anchor="middle" fill="#1e1e1e" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">Who does what in Beat 4</text>
<text x="750" y="70" font-size="17" text-anchor="middle" fill="#495057" font-family="Segoe UI, Helvetica, Arial, sans-serif">Three gates are yours: approve the assessment, approve the plan, review the result. Everything between them is automated and auditable.</text>
<text x="30" y="120" font-size="15" text-anchor="start" fill="#f08c00" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">HUMAN</text>
<text x="30" y="510" font-size="15" text-anchor="start" fill="#4a9eed" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">TOOLS, gh-aw AGENTS AND GITHUB ACTIONS</text>
<rect x="30" y="140" width="180" height="140" rx="10" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
<text x="120.0" y="197" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">1  File the request</text>
<text x="120.0" y="215" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">GitHub issue</text>
<text x="120.0" y="233" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">/modernize</text>
<rect x="238" y="340" width="180" height="140" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="328.0" y="388" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">2  Assess</text>
<text x="328.0" y="406" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">tools measure</text>
<text x="328.0" y="424" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">2 analysts find</text>
<text x="328.0" y="442" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">report with IDs</text>
<rect x="446" y="140" width="180" height="140" rx="10" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
<text x="536.0" y="188" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">3  Approve the</text>
<text x="536.0" y="206" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">assessment</text>
<text x="536.0" y="224" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">gate 1, before</text>
<text x="536.0" y="242" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">any plan</text>
<rect x="654" y="340" width="180" height="140" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="744.0" y="388" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">4  Plan</text>
<text x="744.0" y="406" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">modernize-planner</text>
<text x="744.0" y="424" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">validation, no AI</text>
<text x="744.0" y="442" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">cost estimate</text>
<rect x="862" y="140" width="180" height="140" rx="10" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
<text x="952.0" y="188" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">5  Approve the plan</text>
<text x="952.0" y="206" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">merge the plan PR</text>
<text x="952.0" y="224" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">gate 2, before</text>
<text x="952.0" y="242" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">any code change</text>
<rect x="1070" y="340" width="180" height="140" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="1160.0" y="388" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">6  Execute, verify</text>
<text x="1160.0" y="406" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">agents change code</text>
<text x="1160.0" y="424" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">tests vs baseline</text>
<text x="1160.0" y="442" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">Spec + Standards</text>
<rect x="1278" y="140" width="180" height="140" rx="10" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
<text x="1368.0" y="197" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">7  Review</text>
<text x="1368.0" y="215" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">Implementation PR</text>
<text x="1368.0" y="233" font-size="14" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">gate 3</text>
<path d="M210,250 L258,340" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/>
<path d="M418,370 L466,280" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/>
<path d="M626,250 L674,340" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/>
<path d="M834,370 L882,280" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/>
<path d="M1042,250 L1090,340" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/>
<path d="M1250,370 L1298,280" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/>
<text x="750" y="570" font-size="15" text-anchor="middle" fill="#495057" font-family="Segoe UI, Helvetica, Arial, sans-serif">Humans decide. Agents do the work. Nothing is planned before the assessment is approved, nothing changes before the plan is merged, and nothing reaches main without a human merge.</text>
</svg>
