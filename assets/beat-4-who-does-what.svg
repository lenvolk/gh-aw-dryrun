<text x="275.0" y="338.0" font-size="15" text-anchor="middle" fill="#1e1e1e" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">2  Plan</text>
<text x="275.0" y="356.8" font-size="15" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">modernize-planner</text>
<rect x="370" y="135" width="160" height="95" rx="10" fill="#ffe8a3" stroke="#f59e0b" stroke-width="2"/>
<text x="450.0" y="178.0" font-size="15" text-anchor="middle" fill="#1e1e1e" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">3  Approve the plan</text>
<text x="450.0" y="196.8" font-size="15" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">merge the plan PR</text>
