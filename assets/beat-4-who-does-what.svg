<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 470" width="1250" height="470"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
<rect x="0" y="0" width="1250" height="470" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="625.0" y="38.7" font-size="26" text-anchor="middle" fill="#1e1e1e" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">Who does what in Beat 4</text>
<text x="625.0" y="68.2" font-size="17" text-anchor="middle" fill="#495057" font-family="Segoe UI, Helvetica, Arial, sans-serif">Three gates are yours: approve the plan, approve the assessment, then review the result. Everything between them is automated and auditable.</text>
