<text x="625.0" y="328.6" font-size="15" text-anchor="middle" fill="#1e1e1e" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">4  Assess</text>
<text x="625.0" y="347.4" font-size="15" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">read-only analysts</text>
<text x="625.0" y="366.1" font-size="15" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">+ assessment report</text>
<rect x="720" y="135" width="160" height="95" rx="10" fill="#ffe8a3" stroke="#f59e0b" stroke-width="2"/>
<text x="800.0" y="168.6" font-size="15" text-anchor="middle" fill="#1e1e1e" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">5  Approve the</text>
<text x="800.0" y="187.4" font-size="15" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">assessment</text>
<text x="800.0" y="206.1" font-size="15" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">before any change</text>
<rect x="895" y="295" width="160" height="95" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
<text x="975.0" y="338.0" font-size="15" text-anchor="middle" fill="#1e1e1e" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">6  Upgrade</text>
<text x="975.0" y="356.8" font-size="15" text-anchor="middle" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">agents + tests</text>
